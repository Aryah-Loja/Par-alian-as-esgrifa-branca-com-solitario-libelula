name: Verificar atividade e saúde do Supabase

# Três consultas leves ao banco por dia. Não substitui backup nem plano pago.
# Agendamento depende do GitHub Actions e da migração SQL indicada em docs.
on:
  schedule:
    - cron: "17 3,11,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poloni-verificar-atividade
  cancel-in-progress: false
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar banco e validar backup
        run: node scripts/verificar-atividade-supabase.js --permitir-rpc-pendente
      - name: Registrar orientação em caso de falha
        if: failure()
        run: |
          echo "## A verificação do Supabase falhou" >> "$GITHUB_STEP_SUMMARY"
          echo "Confira o projeto no painel, a migração SQL e o último backup independente. O workflow não exclui nem restaura dados." >> "$GITHUB_STEP_SUMMARY"
