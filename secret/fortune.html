<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bilhete da sorte</title>

    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css">

    <style>
        /* Estilo exclusivo desta página */
        .bilhete-tira {
            margin-top: 26px;
            background: #fffdf8;
            border: 1px solid rgba(183, 110, 121, 0.3);
            border-radius: 6px;
            padding: 22px 18px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1.15rem;
            color: var(--segredo-rose-escuro);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            position: relative;
        }
        .bilhete-tira::before,
        .bilhete-tira::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(183, 110, 121, 0.15) 3px, rgba(183, 110, 121, 0.15) 6px);
        }
        .bilhete-tira::before { left: 0; border-radius: 6px 0 0 6px; }
        .bilhete-tira::after { right: 0; border-radius: 0 6px 6px 0; }
        .bilhete-tira.vazio { color: rgba(51, 51, 51, 0.4); font-style: normal; font-family: inherit; font-size: 0.95rem; }
        .bilhete-tira.puxando { animation: bilhetePuxar 0.5s ease both; }
        @keyframes bilhetePuxar {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="segredo-pagina">
    <div class="segredo-cartao">
        <p class="segredo-eyebrow">Puxe o seu</p>
        <h1 class="segredo-titulo">Bilhete da sorte</h1>
        <p class="segredo-texto" style="text-align:center;">Um bilhetinho apaixonado, sorteado na hora, toda vez que você puxar.</p>

        <!--
            COMO EDITAR OU ADICIONAR BILHETES NO FUTURO:
            Mexa só no array BILHETES_DA_SORTE aqui embaixo. Pode adicionar
            ou remover quantos itens quiser, o sorteio se ajusta sozinho.
        -->
        <div class="bilhete-tira vazio" id="bilheteTexto">Toque no botão pra puxar seu primeiro bilhete.</div>

        <button id="btnPuxarBilhete" class="segredo-btn">Puxar um bilhete</button>

        <a href="../index.html" class="segredo-voltar">← voltar</a>
    </div>

    <script>
        const BILHETES_DA_SORTE = [
            'Hoje é um bom dia pra lembrar que você é o motivo que eu mais gosto de comemorar.',
            'Uma coisa boa está a caminho: sou eu, gostando de você um pouco mais do que ontem.',
            'O Chaves continua amando sanduíche de presunto, e eu continuo amando você do mesmo jeito de sempre.',
            'Sorte de hoje: alguém está pensando em te levar pro Grill esse fim de semana.',
            'Previsão: muitos anos de risada boba de carro pela frente, com direito a estrada de terra de vez em quando.',
            'Aviso importante: você é bem mais especial do que imagina, e eu reparo nisso todo dia.',
            'Sorte de hoje: um abraço apertado está reservado pra você, é só pedir.',
            'Previsão: as próximas viagens vão valer muito a pena, principalmente por causa da companhia.'
        ];

        let ultimoIndiceBilhete = -1;

        function puxarBilhete() {
            let indice = Math.floor(Math.random() * BILHETES_DA_SORTE.length);
            if (BILHETES_DA_SORTE.length > 1) {
                while (indice === ultimoIndiceBilhete) {
                    indice = Math.floor(Math.random() * BILHETES_DA_SORTE.length);
                }
            }
            ultimoIndiceBilhete = indice;

            const tiraEl = document.getElementById('bilheteTexto');
            tiraEl.classList.remove('puxando', 'vazio');
            void tiraEl.offsetWidth;
            tiraEl.textContent = BILHETES_DA_SORTE[indice];
            tiraEl.classList.add('puxando');
        }

        document.getElementById('btnPuxarBilhete').addEventListener('click', puxarBilhete);
    </script>
</body>
</html>
