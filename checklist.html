<!DOCTYPE html>
<html lang="pt-BR" class="checklist-html">
<head>
<meta charset="UTF-8">
<script>
    // Desliga a restauração automática de scroll do navegador — precisa ser
    // a primeiríssima coisa a rodar. Sem isso, ao dar refresh o navegador
    // tenta voltar pro mesmo pixel de scroll de antes, mas a lista de 132
    // itens é montada aos poucos (sincroniza com a nuvem, lê o banco local,
    // só depois desenha a lista inteira), então esse pixel salvo quase
    // nunca corresponde ao mesmo lugar depois do refresh: a página recarrega
    // já no meio da lista, escondendo o card de progresso ("X de Y feitos")
    // lá no topo, e muda de lugar a cada atualização.
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) { /* navegador sem suporte — ignora */ }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1014">
<meta name="robots" content="noindex, nofollow">
<title>Nosso Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- Bibliotecas de terceiros: Dexie (banco local) e JSZip (backup/sincronização
     entre aparelhos) para que marcar um item aqui apareça no celular do outro
     também — mesmo mecanismo usado no resto do site (ver js/sync.js). -->
<script defer src="https://unpkg.com/dexie/dist/dexie.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body class="galeria-body checklist-body">

    <!-- Aviso visível durante o envio para a nuvem (mesmo mecanismo do resto do site). -->
    <div id="auroraSyncBanner" class="aurora-sync-banner d-none">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Salvando na nuvem, não feche o app nem tranque a tela ainda...
    </div>

    <header class="galeria-header">
        <a href="index.html" class="voltar-link"><i class="bi bi-arrow-left"></i> voltar</a>
        <p class="galeria-eyebrow">Coisas para viver juntos</p>
        <h1 class="galeria-titulo">Nosso Checklist</h1>
        <p class="galeria-sub">Um mapa de tudo que ainda vamos fazer, comer, ver e viver, um pelo outro. Vamos riscando aos poucos, sem pressa nenhuma.</p>
    </header>

    <main class="checklist-wrap">
        <div class="checklist-progresso-card reveal-up">
            <div class="checklist-progresso-topo">
                <span id="checklistProgressoTexto" class="checklist-progresso-texto">carregando...</span>
                <span id="checklistProgressoPercentual" class="checklist-progresso-percentual"></span>
            </div>
            <div class="checklist-progresso-barra-fundo">
                <div id="checklistProgressoBarra" class="checklist-progresso-barra-preenchida" style="width:0%"></div>
            </div>
            <p id="checklistProgressoFaltam" class="checklist-progresso-faltam"></p>
            <div class="checklist-adicionar-wrap">
                <button type="button" id="btnChecklistAdicionarItem" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-plus-lg me-1"></i>Adicionar item</button>
            </div>
        </div>

        <div id="checklistCarregando" class="checklist-carregando">
            <div class="spinner-border spinner-border-sm text-rosegold" role="status"></div>
            <p>Abrindo nossa lista...</p>
        </div>

        <div id="checklistCategorias" class="checklist-categorias"></div>
    </main>

    <!-- Modal "Adicionar item": escolhe uma categoria já existente e escreve o texto do item novo. -->
    <div id="checklistModalOverlay" class="carta-discussao-overlay d-none">
        <div class="mapa-modal-caixa checklist-modal-caixa">
            <p class="mapa-modal-titulo">Adicionar um item novo</p>
            <form id="checklistFormAdicionar" class="checklist-form-adicionar">
                <label class="checklist-form-label" for="checklistSelectCategoria">Categoria</label>
                <select id="checklistSelectCategoria" required></select>

                <label class="checklist-form-label" for="checklistInputTexto">O que ainda falta viver?</label>
                <textarea id="checklistInputTexto" rows="2" maxlength="140" required placeholder="Ex.: Assistir ao pôr do sol na represa"></textarea>

                <div class="checklist-form-botoes">
                    <button type="button" id="btnChecklistCancelarAdicionar" class="checklist-form-btn checklist-form-btn-cancelar">Cancelar</button>
                    <button type="submit" class="checklist-form-btn checklist-form-btn-confirmar">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <script defer src="js/config.js"></script>
    <script defer src="js/db.js"></script>
    <script defer src="js/preservacao.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/desktop-block.js"></script>
    <script defer src="js/export.js"></script>
    <script defer src="js/sync.js"></script>
    <script defer src="js/checklist.js"></script>
</body>
</html>
